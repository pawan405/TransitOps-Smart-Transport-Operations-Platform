 <style>
         body {
             background-color: #0D0F12;
             overflow: hidden;
             color: #e2e2e6;
         }
 
         /* Scanline Overlay */
         .scanlines::before {
             content: " ";
             display: block;
             position: absolute;
             top: 0;
             left: 0;
             bottom: 0;
             right: 0;
             background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
             z-index: 20;
             background-size: 100% 2px, 3px 100%;
             pointer-events: none;
         }
 
         /* Dash animation for route line */
         @keyframes drawRoute {
             to { stroke-dashoffset: 0; }
         }
 
         @keyframes pulseBlip {
             0% { transform: scale(1); opacity: 1; }
             50% { transform: scale(1.5); opacity: 0.5; }
             100% { transform: scale(1); opacity: 1; }
         }
 
         .route-path {
             stroke-dasharray: 1000;
             stroke-dashoffset: 1000;
             animation: drawRoute 3s ease-out forwards;
         }
 
         .blip {
             animation: pulseBlip 2s infinite ease-in-out;
         }
 
         .glass-panel {
             background: rgba(20, 24, 29, 0.7);
             backdrop-filter: blur(20px);
             border: 1px solid rgba(255, 255, 255, 0.1);
         }
 
         .glow-cyan {
             box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
         }
 
         .flicker {
             animation: flicker 0.15s infinite;
         }
 
         @keyframes flicker {
             0% { opacity: 0.97; }
             100% { opacity: 1; }
         }
 
         .particle-canvas {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             z-index: 1;
         }
     </style>

 <script>
         // Particle Background Logic
         const canvas = document.getElementById('particles');
         const ctx = canvas.getContext('2d');
         let particles = [];
 
         function initParticles() {
             canvas.width = window.innerWidth;
             canvas.height = window.innerHeight;
             particles = [];
             const count = 80;
             for (let i = 0; i < count; i++) {
                 particles.push({
                     x: Math.random() * canvas.width,
                     y: Math.random() * canvas.height,
                     size: Math.random() * 1.5 + 0.5,
                     speedX: (Math.random() - 0.5) * 0.5,
                     speedY: (Math.random() - 0.5) * 0.5,
                     color: Math.random() > 0.8 ? '#00f0ff' : '#ffffff'
                 });
             }
         }
 
         function animateParticles() {
             ctx.clearRect(0, 0, canvas.width, canvas.height);
             particles.forEach(p => {
                 p.x += p.speedX;
                 p.y += p.speedY;
 
                 if (p.x < 0) p.x = canvas.width;
                 if (p.x > canvas.width) p.x = 0;
                 if (p.y < 0) p.y = canvas.height;
                 if (p.y > canvas.height) p.y = 0;
 
                 ctx.beginPath();
                 ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                 ctx.fillStyle = p.color;
                 ctx.fill();
             });
             requestAnimationFrame(animateParticles);
         }
 
         window.addEventListener('resize', initParticles);
         initParticles();
         animateParticles();
 
         // Form Submission Interaction
         const loginForm = document.getElementById('loginForm');
         const submitBtn = document.getElementById('submitBtn');
         const btnText = document.getElementById('btnText');
         const btnLoader = document.getElementById('btnLoader');
 
         loginForm.addEventListener('submit', (e) => {
             e.preventDefault();
             submitBtn.disabled = true;
             btnText.textContent = "SYNCING TELEMETRY...";
             btnLoader.classList.remove('hidden');
             
             // Simulate connection delay
             setTimeout(() => {
                 btnText.textContent = "CONNECTION ESTABLISHED";
                 submitBtn.classList.remove('text-primary', 'border-primary-container');
                 submitBtn.classList.add('bg-secondary-fixed-dim', 'text-on-secondary-fixed', 'border-secondary-fixed-dim');
                 btnLoader.classList.add('hidden');
                 // Redirect to mission control
                 setTimeout(() => {
                     window.location.href = 'mission-control.html';
                 }, 500);
             }, 1800);
         });
 
         // Input Focus Effects
         const inputs = document.querySelectorAll('input');
         inputs.forEach(input => {
             input.addEventListener('focus', () => {
                 input.parentElement.querySelector('label').classList.add('text-primary');
             });
             input.addEventListener('blur', () => {
                 input.parentElement.querySelector('label').classList.remove('text-primary');
             });
         });
     </script>
